  - lib/core/platform/windows/: win32_bindings (dart:ffi, new dep ffi), native_window (hwnd lookup, frameless/toolwindow/topmost, transparency attempt, monitors, DPI), dock_geometry (pure), window_tracker (enumerate/activate/minimize/close), icon_service (PrivateExtractIconsW + SHGetFileInfo -> ui.Image, file?index), native_menu (TrackPopupMenu).
  - AppLauncher uses ShellExecuteW (args, working dir, ::{CLSID} via shell:, [RecycleBin]).
  - features/dock: DockLayout (pure), DockWindowController (placement, auto-hide polling + animation, multi-monitor by index), DockWindow (real icons, zoom with neighbours, running dots, minimized windows as items, native context menu, drag reorder).
  - Settings launches dock as separate process: RocketDockNext.exe --dock.
  - Tests written (unrun): importer (real fixture), dock_geometry/layout.
real_ini_facts_confirmed_from_user_file:
  - Encoding ANSI/cp1251, CRLF. Sections: [Software\RocketDock], [Software\RocketDock\Icons] (count=N, keys "<n>-FileName|FileName2|Title|Command|Arguments|WorkingDirectory|ShowCmd|OpenRunning|IsSeparator|UseContext|DockletFile"), [Software\RocketDock\WindowFilters] (count).
  - FileName = icon source "path?index" (negative = resource id; large positives after EXE paths are NOT confirmed as indexes -> ignored); Command = launch target; specials "::{CLSID}" and "[RecycleBin]"; relative icon "Icons\\x.png".
  - Mapped: IconMin->iconSize, IconMax/IconMin->zoom, ZoomWidth->neighbors, ZoomTicks->animationMs, ThemeOpacity, LockIcons, AutoHide, AutoHideDelay, PopupDelay, ManageWindows->minimizeToDock, ShowRunning, OpenRunning, HideLabels, Offset, Theme, Side==0 -> top.
  - NOT confirmed (not applied, warned): Side 1/2/3 meaning, Monitor numbering, vOffset, IconQuality, HoverFX, IconActivationFX, zOrderMode, fonts, hotkey.
not_yet_verified:
  - flutter pub get / analyze / test / Windows build and runtime (needs Windows + Flutter stable + VS 2022 C++ workload).
  - Per-pixel transparency (SetWindowCompositionAttribute + DWM glass) may still render a black/opaque background with the stock runner; may require editing windows/runner after `flutter create`.
  - WS_EX_NOACTIVATE + TrackPopupMenu focus behaviour; auto-hide polling; multi-monitor DPI placement; PrivateExtractIconsW/SHGetFileInfo icon extraction; running-window matching by exe path (UWP/ApplicationFrameHost apps not matched).
  - Skins/themes and Docklets are only copied, not applied/executed. WindowFilters not applied.
  - Positive icon indexes after EXE paths in the INI: meaning unknown.
known_limitations:
  - Window covers its bounding box (transparent areas may block clicks until verified); no AppBar work-area reservation; dock process and settings process both write settings.json (last writer wins).
  - Removing the last item makes built-in defaults reappear.
