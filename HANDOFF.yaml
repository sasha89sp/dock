portable_requirements:
  - All mutable settings in data/settings.json beside the executable.
  - No SharedPreferences/AppData, no registry writes.
  - Release build script creates data/Icons, data/Themes, data/Backups and portable.mode.
completed_written_unverified:
  - RocketDock importer REWRITTEN against a real 1.3.5 Settings.ini (cp1251, [Software\RocketDock], flat N-Key entries in [Software\RocketDock\Icons]); fixture test/fixtures/rocketdock_1_3_5_Settings.ini (trimmed, user name anonymised).
